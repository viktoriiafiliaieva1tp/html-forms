<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz rejestracyjny</title>
</head>
<body>
    <form>
        <label for="imie">Imię:</label>
        <input type="text" id="imie" name="imie"><br><br>

        <label for="nazwisko">Nazwisko:</label>
        <input type="text" id="nazwisko" name="nazwisko"><br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="haslo">Hasło:</label>
        <input type="password" id="haslo" name="haslo"><br><br>

        <label for="data">Data urodzenia:</label>
        <input type="date" id="data" name="data"><br><br>

        <p>Status:</p>

        <input type="radio" id="uczen" name="status" value="uczen">
        <label for="uczen">Uczeń</label>
        

        <input type="radio" id="student" name="status" value="student">
        <label for="student">Student</label>

        <input type="radio" id="dorosly" name="status" value="dorosly">
        <label for="dorosly">Dorosły</label>

        <input type="checkbox" id="regulamin" name="regulamin">
        <label for="regulamin">Akceptuję regulamin</label><br><br>

        <label for="miasto">Miasto:</label>
        <select id="miasto" name="miasto">
            <option>Warszawa</option>
            <option>Kraków</option>
            <option>Gdańsk</option>
        </select><br><br>

        <label for="uwagi">Dodatkowe uwagi:</label><br>
        <textarea id="uwagi" name="uwagi"></textarea><br><br>

        <input type="submit" value="Wyślij">
        <input type="reset" value="Wyczyść">
        <button type="button">Pomoc</button>
    </form>
    
</body>
</html>
